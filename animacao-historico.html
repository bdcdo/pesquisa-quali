<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Linha do tempo do efeito sombra</title>
<script>// Primeiro script da página, antes do GSAP e do módulo: o visualizador de slides manda End no
// load do iframe, e o que chegar antes de a interface montar espera nesta fila. iniciar() em
// comum.js instala window.tratarTecla e esvazia a fila.
window.filaTeclas = [];
addEventListener("message", (e) => {
  if (!e.data || e.data.tipo !== "tecla") return;
  if (window.tratarTecla) window.tratarTecla(e.data.key);
  else window.filaTeclas.push(e.data.key);
});
</script>
<style>
:root {
  color-scheme: light;
  --texto: #1a1a1a; --apoio: #505050; --fundo: #ffffff; --painel: #f0f0f0; --borda: #737373;
  --atual: #fff3c4; --contorno: #725400; --realce: #1f4e79;
  --py-comentario: #007400; --py-texto: #a31515; --py-numero: #087550; --py-palavra: #0000ff;
  --py-controle: #af00db; --py-embutida: #795e26; --py-nome: #001080;
  --mono: "DejaVu Sans Mono", Consolas, monospace;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: #26282c; font-family: system-ui, sans-serif; color: var(--texto); overflow: hidden; }
#moldura { position: absolute; left: 0; top: 0; width: 1280px; height: 720px; transform-origin: top left; }
#palco { position: relative; width: 1280px; height: 720px; background: var(--fundo); overflow: hidden; }
.camada { position: absolute; left: 0; top: 0; right: 0; }

#controles { position: absolute; left: 0; right: 0; bottom: 0; height: 56px; display: flex; gap: 8px; align-items: center; justify-content: center;
  color: #f2f2f2; font-size: 15px; padding: 0 12px; }
#controles button { font: inherit; background: #3d3f45; color: #fff; border: 2px solid #8a8d95; border-radius: 4px; padding: 5px 11px; cursor: pointer; }
#controles button[aria-pressed="true"] { background: #f2f2f2; color: #111; border-color: #f2f2f2; }
#controles button:disabled { color: #b9bcc4; border-style: dashed; cursor: default; }
#controles button:focus-visible { outline: 3px solid #ffd35c; outline-offset: 2px; }
#controles .separador { width: 1px; height: 26px; background: #8a8d95; margin: 0 4px; }
#progresso { min-width: 8.5em; text-align: right; font-variant-numeric: tabular-nums; }

.py-comentario { color: var(--py-comentario); }
.py-texto { color: var(--py-texto); }
.py-numero { color: var(--py-numero); }
.py-palavra { color: var(--py-palavra); }
.py-controle { color: var(--py-controle); }
.py-embutida { color: var(--py-embutida); }
.py-nome { color: var(--py-nome); }

/* Camadas por cima dos painéis: setas da consulta embaixo, cartões em voo em cima. */
#setas, #voos { position: absolute; inset: 0; pointer-events: none; }
#voos { z-index: 3; }
#setas svg { position: absolute; inset: 0; overflow: visible; }
.cartao-voo { position: absolute; font: 15px var(--mono); background: var(--fundo); color: var(--texto); border: 2px solid var(--borda);
  border-radius: 3px; padding: 2px 5px; overflow-wrap: anywhere; box-shadow: 0 4px 10px rgba(0,0,0,.35); }

/* Modo embutido (comum.js, MODO_EMBUTIDO): o visualizador de slides desenha título, seção e moldura
   do slide e põe a animação só na área de conteúdo. A página esconde a própria interface e fica só o
   palco, recortado aos painéis, em fundo branco e com a fonte de corpo do template dos slides
   (insper.typ: Inter, depois Arial e análogas; o código continua em DejaVu Sans Mono, que é a do
   template também). A fonte não vai embutida no arquivo: sem Inter instalada, vale a próxima da lista. */
:root { --sans: system-ui, sans-serif; }
html.embutido { --sans: Inter, Arial, Arimo, "Liberation Sans", Lato, sans-serif; }
html.embutido, html.embutido body { background: #fff; font-family: var(--sans); }
html.embutido #cabeca, html.embutido #narracao, html.embutido #controles { display: none; }
/* Modo cheio (comum.js, MODO_CHEIO): o slide inteiro é da animação, e só a barra de controles some. */
html.cheio, html.cheio body { background: #fff; }
html.cheio #controles { display: none; }
/* Palco recortado (comum.js, ajustar): o palco passa da janela, e o documento não pode rolar até lá,
   nem pelo fragmento do cenário, que às vezes é também o id de um elemento (#ambiente). O body corta
   com clip, que não abre área de rolagem, e é o bloco de contenção da moldura (absoluta), para cortá-la
   também; no html, clip valeria como hidden, que rola por âncora. */
html.recortado body { position: relative; overflow: clip; }
</style>
<style>
/* Paleta do template neutro dos slides (tinta, tinta-suave, azul, ferrugem, pinho, grafite), por cima
   das cores de comum.css. A fonte é a do template, sem embutir: sem IBM Plex Sans instalada, vale a
   próxima da lista. */
:root {
  --texto: #1a1a1a; --apoio: #4a4a4a; --fundo: #ffffff; --painel: #f0f0f0; --realce: #0072B2;
  --faixa: #f5f5f5; --sans: "IBM Plex Sans", Inter, Arial, "Liberation Sans", sans-serif;
}
html, body, #palco { font-family: var(--sans); }
/* A câmera: um grupo único com a cena inteira, movido por translate + scale a partir do canto. */
#cena { position: absolute; left: 0; top: 0; width: 1280px; height: 720px; transform-origin: 0 0; }
#titulo { position: absolute; left: 24px; top: 14px; margin: 0; font: 700 28px/36px var(--sans); white-space: nowrap; }
#legenda { position: absolute; right: 24px; top: 18px; display: flex; gap: 18px; align-items: center; font: 22px/28px var(--sans); color: var(--apoio); white-space: nowrap; }
#legenda .marca { display: inline-block; width: 18px; height: 18px; border-radius: 50%; border: 3px solid var(--apoio); vertical-align: -2px; margin-right: 6px; }
#legenda .cheia { background: var(--apoio); }
#legenda .tracejada { display: inline-block; width: 30px; border-top: 3px dashed #A04000; vertical-align: 5px; margin-right: 6px; }
.faixa { position: absolute; left: 16px; right: 16px; background: var(--faixa); border-radius: 6px; }
.rotulo-raia { position: absolute; left: 28px; width: 150px; display: flex; flex-direction: column; justify-content: center; }
.rotulo-raia b { font: 700 24px/28px var(--sans); }
.rotulo-raia span { font: 22px/26px var(--sans); color: var(--apoio); }
.ano { position: absolute; top: 58px; height: 30px; border-top: 2px solid var(--apoio); text-align: center; font: 700 22px/28px var(--sans); color: var(--apoio); }
svg#tracos { position: absolute; left: 0; top: 0; overflow: visible; pointer-events: none; }
#tracos .linha-raia { stroke-width: 2; }
#tracos .linha-vazia { stroke-dasharray: 8 7; }
#tracos .seta { fill: none; stroke-width: 3; }
#tracos .seta.ameaca { stroke-dasharray: 7 5; }
.bolinha { position: absolute; width: 22px; height: 22px; margin: -11px 0 0 -11px; border-radius: 50%; border: 3px solid; background: #fff; }
.data { position: absolute; transform: translateX(-50%); font: 600 22px/26px var(--sans); white-space: nowrap; color: var(--texto); }
#anel { position: absolute; width: 38px; height: 38px; margin: -19px 0 0 -19px; border-radius: 50%; border: 3px solid var(--texto); }
/* O cartão do evento mora na cena, com letra pequena em px da cena, e é lido no zoom (escala 2,6):
   11 px viram 28,6 px de palco. Altura fixa, para verificar.mjs acusar texto que não caiba. */
.cartao-evento { position: absolute; background: #fff; border: 2px solid; border-left-width: 6px; border-radius: 4px; padding: 6px 9px;
  box-shadow: 0 2px 6px rgba(0,0,0,.18); overflow: hidden; }
.cartao-evento .cabeca { font: 700 13px/17px var(--sans); }
.cartao-evento .cabeca .ator { font-weight: 600; }
.cartao-evento p { margin: 3px 0 0; font: 11px/14.5px var(--sans); color: var(--texto); }
.cartao-evento .direcao { margin-top: 4px; font: 600 11px/14.5px var(--sans); color: var(--apoio); }
#rotulo-final { position: absolute; left: 200px; right: 40px; text-align: center; font: 700 27px/34px var(--sans); color: #006B55; }
/* O rótulo interrompe a linha tracejada da raia, com o fundo da faixa por trás, em vez de riscá-la. */
#rotulo-final span { background: var(--faixa); padding: 0 14px; }
/* A narração fica fora da câmera e cobre a faixa de baixo do palco inteira, para a cena ampliada não
   aparecer pelas bordas dela. */
#narracao { position: absolute; left: 0; right: 0; bottom: 0; height: 108px; border: solid #fff; border-width: 0 16px; background: var(--painel);
  box-shadow: inset 6px 0 0 var(--realce); }
#narracao .fala { margin: 0; padding: 0 40px 0 22px; height: 108px; display: flex; align-items: center; font: 27px/35px var(--sans); }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; animation: none !important; } }
</style>

<script type="module">// ---- ./estados.js ----
// Linha do tempo do caso norueguês do efeito sombra (benefícios de seguridade levados ao exterior):
// quatro raias, uma por ator, e o tempo da esquerda para a direita. Cada evento é uma bolinha na
// raia do ator. A câmera, no estilo de apresentação com zoom, alterna dois passos por evento: o zoom
// na bolinha, em que o cartão do evento abre, e o recuo à visão geral, com a bolinha já marcada.
// A raia do Tribunal da EFTA não recebe evento nenhum: as ameaças de consulta da NIC são setas
// tracejadas que param antes dela, e é esse vazio que a cena final nomeia.
//
// Módulo puro, sem DOM: os eventos, a geometria da cena (em coordenadas do palco de 1280 × 720) e
// os estados. A página desenha a partir daqui, e tools/test-animacao-sombra-noruega.py confere datas,
// ordem, atores, setas, enquadramento e que todo passo muda a tela.

// Raias de cima para baixo. A ordem põe lado a lado os atores que trocam setas (Governo e NAV, NAV e
// NIC, NIC e o tribunal), para nenhuma seta atravessar a raia de um terceiro.
const ATORES = [
  {id: "governo", nome: "Governo", descricao: ["ministérios"], cor: "#333333"},
  {id: "nav", nome: "NAV", descricao: ["agência de", "benefícios"], cor: "#0072B2"},
  {id: "nic", nome: "NIC", descricao: ["instância", "recursal"], cor: "#A04000"},
  {id: "tribunal", nome: "Tribunal", nome2: "da EFTA", descricao: [], cor: "#006B55"},
];
const NOME_DO_ATOR = {governo: "Governo", nav: "NAV", nic: "NIC", tribunal: "Tribunal da EFTA"};

// Cada evento: inicio (data ISO parcial, para a ordem), data (rótulo da bolinha), dataLonga (cabeçalho
// do cartão), ator, texto do cartão, seta (para quem, e se é ameaça), e as duas falas: a do zoom e a
// do recuo à visão geral.
const EVENTOS = {
  alertas: [
    {id: "lei-2006", inicio: "2006", data: "2006", dataLonga: "2006", ator: "governo", seta: null,
      texto: "Lei condiciona o auxílio-doença à residência na Noruega.",
      zoom: "A regra nasce na lei: quem recebe auxílio-doença tem de morar na Noruega.",
      geral: "2006 fica marcado na raia do Governo. A próxima bolinha é da NAV."},
    {id: "auditoria-2009", inicio: "2009", data: "2009", dataLonga: "2009", ator: "nav", seta: null,
      texto: "Auditoria interna mostra que a diretoria da NAV duvidava da compatibilidade com o direito do EEE.",
      zoom: "Já em 2009, a própria diretoria da NAV duvidava da regra.",
      geral: "A dúvida de 2009 fica marcada na raia da NAV, sem seta para ninguém."},
    {id: "cupula-2013", inicio: "2013", data: "2013", dataLonga: "2013", ator: "governo", seta: null,
      texto: "A cúpula do Ministério do Trabalho barra proposta de afrouxar a autorização prévia para viajar.",
      zoom: "Em 2013, houve proposta de afrouxar a regra, e o ministério a barrou.",
      geral: "Duas bolinhas marcadas no Governo: a lei e a proposta barrada."},
    {id: "forum-2014", inicio: "2014", data: "2014–2015", dataLonga: "2014–2015", ator: "nav", seta: null,
      texto: "Servidores da linha de frente da NAV levantam a dúvida num fórum interno. Ninguém responde.",
      zoom: "A dúvida chega à linha de frente da NAV, e o fórum interno fica sem resposta.",
      geral: "Segunda bolinha marcada na NAV: a dúvida agora vem de baixo."},

const animacao = "sombra-noruega";
const destino = "pesquisa/apresentacoes-palestras/shadow-effect-26-11-06/animacao-historico.html";
const cenarios = [
  {id: "alertas", rotulo: "2006 a 2018", titulo: "2006 a 2018: os alertas que não mudaram a prática",
    abertura: "Um ator por raia, e o tempo da esquerda para a direita. Cada bolinha vazia é um evento por ver; a raia do tribunal está vazia."},
  {id: "ameaca", rotulo: "2018 e 2019", titulo: "Nov. 2018 a out. 2019: a ameaça que mudou a prática",
    abertura: "Onze meses, da primeira carta da NIC à reforma. As bolinhas vazias são os eventos por ver; o tribunal segue vazio."},
];
const eventos = (id) => EVENTOS[id];
const tituloDe = (id) => cenarios.find((c) => c.id === id).titulo;
// Faixas de ano sobre as colunas, só onde a bolinha mostra dia e mês: [ano, primeira, última coluna].
const anos = (id) => id === "ameaca" ? [["2018", 0, 3], ["2019", 4, 9]] : [];

// ---------- geometria, em coordenadas da cena (as do palco na visão geral) ----------
// A cena vai de y = 0 a 600; abaixo fica a narração, fora da câmera.
const CENA = {largura: 1280, alturaVisivel: 600, xEventos: 200, xFim: 1260, raio: 11};
const RAIAS = {topo: 96, altura: 120, folga: 6};
const linhaDa = (ator) => {
  const k = ATORES.findIndex((a) => a.id === ator);
  return RAIAS.topo + k * (RAIAS.altura + RAIAS.folga) + RAIAS.altura / 2;
};
const faixaDa = (ator) => {
  const k = ATORES.findIndex((a) => a.id === ator), topo = RAIAS.topo + k * (RAIAS.altura + RAIAS.folga);
  return {topo, base: topo + RAIAS.altura};
};
// O cartão do evento, em px da cena, e a escala da câmera no zoom. A letra do cartão (11 px) vezes a
// escala tem de passar de 26,7 px de palco, os 20pt do corpo no slide (README, "Piso de legibilidade"):
// 11 × 2,6 = 28,6 px.
const CARTAO = {largura: 360, afastamento: 30, letra: 11};
// Altura do cartão pelo texto: cabeçalho, linhas do texto e, havendo seta, a linha de direção. A
// estimativa de caracteres por linha fica abaixo da medida da IBM Plex Sans a 11 px (cerca de 57 na
// largura útil), e a altura é fixa no CSS: se a estimativa errar para menos, verificar.mjs acusa o
// cartão (.painel) que transborda.
const POR_LINHA = 52, LINHA = 14.5;
const textoDaDirecao = (e) => e.seta ? `${NOME_DO_ATOR[e.ator]} → ${NOME_DO_ATOR[e.seta.para]}` +
  (e.seta.ameaca ? ": seta tracejada, ameaça de consulta, sem consulta feita" : "") : null;
const alturaDoCartao = (e) => {
  const linhas = (t) => Math.ceil(t.length / POR_LINHA);
  const direcao = textoDaDirecao(e);
  return Math.ceil(16 + 17 + 3 + linhas(e.texto) * LINHA + (direcao ? 4 + linhas(direcao) * LINHA : 0));
};
const ZOOM = {escala: 2.6, centro: {x: 640, y: 300}, margem: {x: 40, y: 24}};
// A seta de ameaça para esta distância antes da faixa do tribunal: chega perto e não toca.
const FOLGA_DA_AMEACA = 16;

function geometria(id) {
  const lista = EVENTOS[id], n = lista.length, passo = (CENA.xFim - CENA.xEventos) / n;
  return lista.map((e, k) => {
    const x = CENA.xEventos + (k + 0.5) * passo, y = linhaDa(e.ator);
    let seta = null;
    if (e.seta) {
      const sobe = linhaDa(e.seta.para) < y;
      const origem = y + (sobe ? -CENA.raio : CENA.raio);
      // A seta comum termina na linha da raia de destino; a de ameaça, antes da faixa do tribunal.
      const fim = e.seta.ameaca ? faixaDa(e.seta.para).topo - FOLGA_DA_AMEACA : linhaDa(e.seta.para);
      seta = {x, y1: origem, y2: fim, sobe, ameaca: e.seta.ameaca};
    }
    // O rótulo de data fica do lado oposto ao da seta, para a seta não riscá-lo.
    const rotulo = seta && seta.sobe ? "abaixo" : "acima";
    // Cartão ao lado da bolinha (à direita, salvo perto da borda), centrado na altura entre a bolinha e
    // a ponta da seta: assim ele não cobre a seta nem a bolinha.
    const direita = x + CARTAO.afastamento + CARTAO.largura <= CENA.largura - 10;
    const meio = seta ? (seta.y1 + seta.y2) / 2 : y;
    const cartao = {x: direita ? x + CARTAO.afastamento : x - CARTAO.afastamento - CARTAO.largura,
      y: meio - alturaDoCartao(e) / 2, w: CARTAO.largura, h: alturaDoCartao(e)};
    // Enquadramento: a caixa que junta bolinha (com o anel de foco), seta e cartão, centrada na área da
    // câmera, na escala do zoom.
    const anel = CENA.raio + 8;
    const xs = [x - anel, x + anel, cartao.x, cartao.x + cartao.w];
    const ys = [y - anel, y + anel, cartao.y, cartao.y + cartao.h, ...(seta ? [seta.y1, seta.y2] : [])];
    const caixa = {x: Math.min(...xs), y: Math.min(...ys), w: Math.max(...xs) - Math.min(...xs), h: Math.max(...ys) - Math.min(...ys)};
    const s = ZOOM.escala, cx = caixa.x + caixa.w / 2, cy = caixa.y + caixa.h / 2;
    const camera = {x: round(ZOOM.centro.x - s * cx), y: round(ZOOM.centro.y - s * cy), scale: s};
    return {id: e.id, x: round(x), y, seta, rotulo, cartao: mapear(cartao, round), caixa, camera};
  });
}
const round = (v) => Math.round(v * 100) / 100;
const mapear = (o, f) => Object.fromEntries(Object.entries(o).map(([k, v]) => [k, f(v)]));
const CAMERA_GERAL = {x: 0, y: 0, scale: 1};

// ---------- estados ----------
// camera: "geral" ou o id do evento em zoom; vistos: eventos já marcados (bolinha cheia); atual: o
// evento com o anel de foco; setas: eventos cuja seta está desenhada; cartao: evento com o cartão
// aberto; rotuloFinal: o rótulo na raia vazia do tribunal.
function montar(id) {
  const lista = EVENTOS[id], abertura = cenarios.find((c) => c.id === id).abertura;
  const estados = [];
  let s = {camera: "geral", vistos: [], atual: null, setas: [], cartao: null, rotuloFinal: false};
  const add = (m, narr, dur) => { s = {...s, ...m}; estados.push(JSON.parse(JSON.stringify({...s, narr, dur}))); };
  add({}, abertura, 4000);
  for (const e of lista) {
    add({camera: e.id, cartao: e.id, atual: e.id, vistos: [...s.vistos, e.id], setas: e.seta ? [...s.setas, e.id] : s.setas}, e.zoom, 4200);
    const setas = e.retiraAmeacas ? s.setas.filter((x) => !lista.find((y) => y.id === x).seta.ameaca) : s.setas;
    add({camera: "geral", cartao: null, setas, rotuloFinal: Boolean(e.final)}, e.geral, 3200);
  }
  return estados;
}


// ---- ../../comum/comum.js ----
// Peças que todas as animações compartilham: durações do roteiro, pilha de textos por passo,
// medição no espaço do palco, voo de cartão, tocador sobre a timeline, teclas e escala do palco.
// gsap e os plugins chegam como globais (scripts UMD), tanto no fonte quanto no dist.

const reduzido = matchMedia("(prefers-reduced-motion: reduce)").matches;
// Modo embutido: o visualizador de slides, com o parâmetro moldura=slide, põe a animação só na área
// de conteúdo de um slide comum e pede este modo com ?embutido no src do iframe (antes do #cenario).
// A página esconde título, barra de controles e narração (comum.css, html.embutido) e ajustar()
// recorta o palco aos painéis. Sem o parâmetro, nada muda.
//
// Modo cheio (?embutido=cheio, pedido pelo visualizador com moldura=cheia): a animação ocupa o slide
// inteiro, com título e narração, e só a barra de controles some, porque avançar, voltar e contar
// passos ficam com o visualizador. Sem a barra de 56 px, o palco de 1280 x 720 enche uma página 16:9
// de ponta a ponta, e a letra fica do tamanho que foi desenhada para ter.
const _embutido = new URLSearchParams(location.search).get("embutido");
const MODO_CHEIO = _embutido === "cheio";
const MODO_EMBUTIDO = _embutido !== null && !MODO_CHEIO;
if (MODO_EMBUTIDO) document.documentElement.classList.add("embutido");
if (MODO_CHEIO) document.documentElement.classList.add("cheio");
const $ = (id) => document.getElementById(id);
const escapar = (texto) => String(texto).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");

function criarEl(tag, classe, html) {
  const el = document.createElement(tag);
  if (classe) el.className = classe;
  if (html !== undefined) el.innerHTML = html;
  return el;
}

// Durações do roteiro visual (CONTRATO.md), em segundos.
const DUR = {voo: 0.7, seta: 0.5, conector: 0.5, marcador: 0.35, digitacao: 1.2, narracao: 0.25, salto: 0.18};
gsap.registerPlugin(CustomEase);
const CURVA = CustomEase.create("curva", ".3,.7,.2,1");

// ---------- pilha de textos ----------
// Um elemento por valor, empilhados no mesmo lugar; o passo só decide qual fica visível.
// Assim a timeline anda para trás por seek sem precisar reescrever texto.
function criarPilha(container, valores, criar) {
  const elementos = [], indices = [];
  let anterior;
  valores.forEach((valor, i) => {
    if (i === 0 || valor !== anterior) {
      const el = criar(valor);
      el.classList.add("camada");
      container.appendChild(el);
      elementos.push(el);
    }
    indices.push(elementos.length - 1);
    anterior = valor;
  });
  gsap.set(elementos, {autoAlpha: 0});
  gsap.set(elementos[indices[0]], {autoAlpha: 1});
  return {
    elementos,
    noPasso: (i) => elementos[indices[i]],
    mudou: (i) => indices[i] !== indices[i - 1],
    // Sem `chegada`, fade em sequência: o texto velho sai na primeira metade do fade e o novo entra
    // na segunda, nunca os dois visíveis juntos. Com `chegada`, troca seca no instante em que o cartão pousa.
    // Os dois lados são fromTo, com o ponto de partida explícito: um `to` grava o valor de partida no
    // primeiro render, e depois de um seek esse valor pode ser o de outro passo, deixando dois ou três
    // textos acesos ao mesmo tempo quando se avança rápido.
    transicao(tl, i, t, chegada) {
      if (indices[i] === indices[i - 1]) return;
      const velho = elementos[indices[i - 1]], novo = elementos[indices[i]];
      if (chegada !== undefined) { tl.set(velho, {autoAlpha: 0}, chegada); tl.set(novo, {autoAlpha: 1}, chegada); return; }
      const meio = DUR.narracao / 2;
      tl.fromTo(velho, {autoAlpha: 1}, {autoAlpha: 0, duration: meio, ease: "none", immediateRender: false}, t);
      tl.fromTo(novo, {autoAlpha: 0}, {autoAlpha: 1, duration: meio, ease: "none", immediateRender: false}, t + meio);
    },
  };
}

const criarNarracao = (container, textos) => criarPilha(container, textos, (texto) => criarEl("p", "fala", escapar(texto)));

// ---------- medição e voo ----------
// Caixa de um elemento em coordenadas do palco (1280×720), descontando a escala da moldura.
function caixa(el) {
  const p = $("palco").getBoundingClientRect(), r = el.getBoundingClientRect(), k = p.width / 1280;
  return {x: (r.left - p.left) / k, y: (r.top - p.top) / k, w: r.width / k, h: r.height / k};
}
// Caixa de um trecho de texto dentro de um elemento, pelos nós de texto (o código colorido é
// uma sequência de spans, e o trecho pode atravessar vários).
function caixaTrecho(el, trecho) {
  const nos = [], andar = document.createTreeWalker(el, NodeFilter.SHOW_TEXT);
  let texto = "";
  while (andar.nextNode()) { nos.push({no: andar.currentNode, ini: texto.length}); texto += andar.currentNode.data; }
  const ini = texto.indexOf(trecho);
  if (ini < 0) return null;
  const fim = ini + trecho.length, faixa = document.createRange();
  const inicio = nos.find((x) => ini >= x.ini && ini < x.ini + x.no.data.length);
  const final = nos.find((x) => fim > x.ini && fim <= x.ini + x.no.data.length);
  faixa.setStart(inicio.no, ini - inicio.ini);
  faixa.setEnd(final.no, fim - final.ini);
  const p = $("palco").getBoundingClientRect(), r = faixa.getBoundingClientRect(), k = p.width / 1280;
  return {x: (r.left - p.left) / k, y: (r.top - p.top) / k, w: r.width / k, h: r.height / k};
}

// O cartão mora na camada de voos já no ponto de chegada (left/top); o voo o põe sobre a origem
// por transform e o traz de volta a (0, 0) por um arco do MotionPath.
function posicionarCartao(cartao, chegada) {
  Object.assign(cartao.style, {left: chegada.x + "px", top: chegada.y + "px"});
  if (chegada.w) cartao.style.width = chegada.w + "px";
  gsap.set(cartao, {autoAlpha: 0});
}
// O arco passa, no ponto médio, 40 px acima da reta entre as duas pontas (roteiro visual).
const ARCO = 40;
const pontoDoArco = (dx, dy) => ({x: dx / 2, y: dy / 2 - ARCO});
function voar(tl, cartao, origem, chegada, t) {
  const dx = origem.x - chegada.x, dy = origem.y - chegada.y;
  tl.set(cartao, {x: dx, y: dy, autoAlpha: 1}, t);
  tl.to(cartao, {motionPath: {path: [pontoDoArco(dx, dy), {x: 0, y: 0}], curviness: 1}, duration: DUR.voo, ease: CURVA}, t);
  tl.set(cartao, {autoAlpha: 0}, t + DUR.voo);
  return t + DUR.voo;
}

// ---------- tocador ----------
// A timeline tem um rótulo "p<i>" no fim da transição que leva ao estado i. Avançar toca até o
// próximo rótulo; voltar, pular e trocar de cenário fazem seek por baixo de um fade curto de uma
// cópia do palco (o estado de origem some sobre o de destino já montado), sem tocar nada ao contrário.
function iniciar({animacao, cenarios, rotulos, preparar, espera}) {
  let cenario, estados, tl, pos = 0, movimento = null, tocando = false, relogio = null, sombra = null;

  function publicar() {
    window.animacao = {animacao, cenario, pos, total: estados.length, estado: estados[pos]};
    $("progresso").textContent = `Passo ${pos + 1} de ${estados.length}`;
    $("voltar").disabled = pos === 0;
    $("avancar").disabled = pos === estados.length - 1;
    $("tocar").textContent = tocando ? "⏸ Pausar" : "▶ Tocar";
    $("tocar").setAttribute("aria-pressed", String(tocando));
    for (const id of cenarios) $("cenario-" + id).setAttribute("aria-pressed", String(id === cenario));
    if (parent !== window) parent.postMessage({tipo: "animacao", pos, total: estados.length}, "*");
  }
  // A cópia fica sobre o palco com os mesmos ids por 0,18 s; ela vem depois no documento, então
  // getElementById continua achando o palco verdadeiro.
  function esmaecer(acao) {
    if (reduzido) { acao(); return; }
    if (sombra) { gsap.killTweensOf(sombra); sombra.remove(); }
    const copia = sombra = $("palco").cloneNode(true);
    Object.assign(copia.style, {position: "absolute", left: "0", top: "0", pointerEvents: "none"});
    copia.setAttribute("aria-hidden", "true");
    copia.inert = true;
    $("moldura").appendChild(copia);
    acao();
    gsap.to(copia, {autoAlpha: 0, duration: DUR.salto, ease: "none", onComplete: () => { copia.remove(); if (sombra === copia) sombra = null; }});
  }
  function ir(destino, animar) {
    destino = Math.max(0, Math.min(estados.length - 1, destino));
    const emMovimento = movimento && movimento.isActive();
    if (movimento) { movimento.kill(); movimento = null; }
    if (animar && destino === pos + 1 && !reduzido) {
      // Avançar durante uma transição conclui a corrente na hora.
      tl.seek("p" + pos, true);
      movimento = tl.tweenTo("p" + destino, {ease: "none"});
    } else if (destino !== pos || emMovimento) {
      esmaecer(() => tl.seek("p" + destino, true));
    }
    pos = destino;
    if (pos === estados.length - 1) parar();
    publicar();
  }
  function agendar() {
    clearTimeout(relogio);
    if (tocando) relogio = setTimeout(() => { ir(pos + 1, true); agendar(); }, espera(estados[pos]));
  }
  function parar() { tocando = false; clearTimeout(relogio); }
  function alternar() {
    if (tocando) { parar(); publicar(); return; }
    if (pos === estados.length - 1) ir(0, false);
    tocando = true; ir(pos + 1, true); agendar();
  }
  function montar(id) {
    if (movimento) { movimento.kill(); movimento = null; }
    if (tl) tl.kill();
    cenario = id;
    ({estados, tl} = preparar(id));
    pos = 0; tl.seek("p0", true);
  }
  function trocar(id) {
    parar();
    esmaecer(() => montar(id));
    ajustar();
    publicar();
  }

  const barra = $("controles");
  barra.innerHTML = `<button id="reiniciar" title="Home ou R">⏮ Início</button><button id="voltar" title="← ou Page Up">◀ Voltar</button>` +
    `<button id="tocar" title="Espaço" aria-pressed="false">▶ Tocar</button><button id="avancar" title="→ ou Page Down">Avançar ▶</button>` +
    `<span class="separador" aria-hidden="true"></span>` +
    cenarios.map((id, k) => `<button id="cenario-${id}" title="${k + 1}" aria-pressed="false">${k + 1} · ${rotulos[k]}</button>`).join("") +
    `<span class="separador" aria-hidden="true"></span><span id="progresso" aria-live="polite"></span>`;
  $("reiniciar").onclick = () => { parar(); ir(0, false); };
  $("voltar").onclick = () => { parar(); ir(pos - 1, false); };
  $("avancar").onclick = () => { parar(); ir(pos + 1, true); };
  $("tocar").onclick = alternar;
  cenarios.forEach((id) => { $("cenario-" + id).onclick = () => trocar(id); });

  function tratarTecla(k) {
    if (k === " ") alternar();
    else if (k === "ArrowRight" || k === "PageDown") { parar(); ir(pos + 1, true); }
    else if (k === "ArrowLeft" || k === "PageUp") { parar(); ir(pos - 1, false); }
    else if (k === "Home" || k.toLowerCase() === "r") { parar(); ir(0, false); }
    else if (k === "End") { parar(); ir(estados.length - 1, false); }
    else if (/^[1-9]$/.test(k) && cenarios[Number(k) - 1]) trocar(cenarios[Number(k) - 1]);
    else return false;
    return true;
  }
  document.addEventListener("keydown", (e) => {
    if (e.altKey || e.ctrlKey || e.metaKey) return;
    // Espaço sobre um botão focado já dispara o clique; tratar de novo tocaria e pausaria de uma vez.
    if (e.key === " " && e.target.closest?.("button")) return;
    if (tratarTecla(e.key)) e.preventDefault();
  });

  // Recorte do palco que aparece na janela, em coordenadas do palco. No modo padrão, o palco inteiro
  // acima da barra de 56 px, como sempre foi. No embutido, a caixa que envolve os painéis, com 8 px de
  // folga, e sem barra. Sem narração (um tema que a esconde no próprio CSS), o palco até o fim dos
  // painéis, com a barra. O resto do palco fica cortado por clip-path, para não aparecer na sobra da
  // janela nem por baixo da barra, que não tem fundo.
  function recorte() {
    if (MODO_CHEIO) return {x: 0, y: 0, w: 1280, h: 720, barra: 0};
    const narracao = $("narracao");
    const semNarracao = !MODO_EMBUTIDO && narracao && getComputedStyle(narracao).display === "none";
    if (!MODO_EMBUTIDO && !semNarracao) return {x: 0, y: 0, w: 1280, h: 720, barra: 56};
    const paineis = [...$("palco").querySelectorAll(".painel")].filter((p) => getComputedStyle(p).display !== "none");
    if (!paineis.length) return {x: 0, y: 0, w: 1280, h: 720, barra: MODO_EMBUTIDO ? 0 : 56};
    const fundo = Math.max(...paineis.map((p) => p.offsetTop + p.offsetHeight));
    if (semNarracao) return {x: 0, y: 0, w: 1280, h: Math.min(720, fundo + 12), barra: 56};
    const esq = Math.min(...paineis.map((p) => p.offsetLeft)), topo = Math.min(...paineis.map((p) => p.offsetTop));
    const dir = Math.max(...paineis.map((p) => p.offsetLeft + p.offsetWidth));
    const x = Math.max(0, esq - 8), y = Math.max(0, topo - 8);
    return {x, y, w: Math.min(1280, dir + 8) - x, h: Math.min(720, fundo + 8) - y, barra: 0};
  }
  function ajustar() {
    const r = recorte();
    const escala = Math.min(innerWidth / r.w, (innerHeight - r.barra) / r.h);
    const moldura = $("moldura");
    moldura.style.transform = `scale(${escala})`;
    moldura.style.left = Math.max(0, (innerWidth - r.w * escala) / 2) - r.x * escala + "px";
    moldura.style.top = Math.max(0, (innerHeight - r.barra - r.h * escala) / 2) - r.y * escala + "px";
    if (r.w < 1280 || r.h < 720) {
      $("palco").style.clipPath = `inset(${r.y}px ${1280 - r.x - r.w}px ${720 - r.y - r.h}px ${r.x}px)`;
      // O palco recortado passa da janela; comum.css (html.recortado) impede que a página role até lá.
      document.documentElement.classList.add("recortado");
    }
  }
  addEventListener("resize", ajustar);
  ajustar();
  const inicial = decodeURIComponent(location.hash.slice(1));
  montar(cenarios.includes(inicial) ? inicial : cenarios[0]);
  // De novo depois de montar: há páginas que criam os painéis em preparar(), e o recorte depende deles.
  ajustar();
  publicar();
  // Teclas que chegaram pela ponte antes da montagem (ponte.js), na ordem em que chegaram.
  window.tratarTecla = tratarTecla;
  for (const k of window.filaTeclas.splice(0)) tratarTecla(k);
}


gsap.registerPlugin(DrawSVGPlugin);
const SVG = "http://www.w3.org/2000/svg";
const COR = Object.fromEntries(ATORES.map((a) => [a.id, a.cor]));
// Câmera: 0,8 s, saída e chegada suaves. O cartão abre e a seta se desenha quando a câmera assenta;
// o contexto (títulos, nomes das raias, datas) some no começo do zoom e volta no fim do recuo.
const CAMERA = 0.8, SUAVE = "power2.inOut", ASSENTA = 0.6;

function svg(tag, atributos, classe) {
  const el = document.createElementNS(SVG, tag);
  for (const [k, v] of Object.entries(atributos)) el.setAttribute(k, v);
  if (classe) el.setAttribute("class", classe);
  return $("tracos").appendChild(el);
}

function preparar(cenario) {
  const estados = montar(cenario), lista = eventos(cenario), geo = geometria(cenario);
  const indice = Object.fromEntries(lista.map((e, k) => [e.id, k]));
  for (const id of ["raias", "tracos", "bolinhas", "cartoes", "narracao", "legenda"]) { gsap.killTweensOf($(id).querySelectorAll("*")); $(id).innerHTML = ""; }
  gsap.killTweensOf([$("cena"), $("anel"), $("rotulo-final")]);

  $("titulo").textContent = tituloDe(cenario);
  $("legenda").innerHTML = `<span><span class="marca"></span>por ver</span><span><span class="marca cheia"></span>visto</span>` +
    (lista.some((e) => e.seta?.ameaca) ? `<span><span class="tracejada"></span>ameaça</span>` : "");

  // Raias: faixa, nome do ator e a linha do tempo dele (tracejada no tribunal, que fica vazio).
  for (const a of ATORES) {
    const {topo, base} = faixaDa(a.id), y = linhaDa(a.id);
    $("raias").appendChild(Object.assign(criarEl("div", "faixa"), {style: `top:${topo}px;height:${base - topo}px`}));
    const rotulo = criarEl("div", "rotulo-raia contexto",
      `<b style="color:${a.cor}">${escapar(a.nome)}</b>` + (a.nome2 ? `<b style="color:${a.cor}">${escapar(a.nome2)}</b>` : "") +
      a.descricao.map((d) => `<span>${escapar(d)}</span>`).join(""));
    Object.assign(rotulo.style, {top: topo + "px", height: (base - topo) + "px"});
    $("raias").appendChild(rotulo);
    svg("line", {x1: CENA.xEventos - 14, x2: CENA.xFim, y1: y, y2: y, stroke: a.cor}, "linha-raia" + (a.id === "tribunal" ? " linha-vazia" : ""));
  }
  const passo = (CENA.xFim - CENA.xEventos) / lista.length;
  for (const [ano, de, ate] of anos(cenario)) {
    const el = criarEl("div", "ano contexto", ano);
    Object.assign(el.style, {left: (CENA.xEventos + de * passo + 6) + "px", width: ((ate - de + 1) * passo - 12) + "px"});
    $("raias").appendChild(el);
  }
  $("rotulo-final").style.top = (linhaDa("tribunal") - 17) + "px";

  // Setas, por baixo das bolinhas: haste e ponta, que se desenham juntas.
  const setas = {};
  for (const g of geo) {
    if (!g.seta) continue;
    const e = lista[indice[g.id]], cor = COR[e.ator], {x, y1, y2, sobe, ameaca} = g.seta, d = sobe ? 1 : -1;
    const haste = svg("path", {d: `M${x},${y1} L${x},${y2 + d * 9}`, stroke: cor}, "seta" + (ameaca ? " ameaca" : ""));
    const ponta = svg("path", {d: `M${x - 8},${y2 + d * 12} L${x},${y2} L${x + 8},${y2 + d * 12} Z`, fill: cor});
    setas[g.id] = {haste, ponta, ameaca};
  }
  // Bolinhas, com o rótulo de data do lado oposto ao da seta.
  const bolinhas = {}, datas = {};
  for (const g of geo) {
    const e = lista[indice[g.id]];
    const b = criarEl("div", "bolinha");
    Object.assign(b.style, {left: g.x + "px", top: g.y + "px", borderColor: COR[e.ator]});
    bolinhas[g.id] = $("bolinhas").appendChild(b);
    const rotulo = criarEl("div", "data contexto", escapar(e.data));
    Object.assign(rotulo.style, {left: g.x + "px", top: (g.rotulo === "acima" ? g.y - CENA.raio - 32 : g.y + CENA.raio + 6) + "px"});
    datas[g.id] = $("bolinhas").appendChild(rotulo);
  }
  // Cartões: data e ator, o que aconteceu e, havendo seta, de quem para quem.
  const cartoes = {};
  for (const g of geo) {
    const e = lista[indice[g.id]];
    const direcao = e.seta ? `<div class="direcao">${escapar(textoDaDirecao(e))}</div>` : "";
    const c = criarEl("div", "cartao-evento painel",
      `<div class="cabeca">${escapar(e.dataLonga)} · <span class="ator" style="color:${COR[e.ator]}">${escapar(NOME_DO_ATOR[e.ator])}</span></div>` +
      `<p>${escapar(e.texto)}</p>${direcao}`);
    c.id = "cartao-" + e.id;
    Object.assign(c.style, {left: g.cartao.x + "px", top: g.cartao.y + "px", width: g.cartao.w + "px", height: g.cartao.h + "px", borderColor: COR[e.ator]});
    cartoes[g.id] = $("cartoes").appendChild(c);
  }
  const narracao = criarNarracao($("narracao"), estados.map((s) => s.narr));
  const contexto = [...$("cena").querySelectorAll(".contexto")];
  const cameraDe = (s) => s.camera === "geral" ? CAMERA_GERAL : geo[indice[s.camera]].camera;
  const posAnel = (id) => ({left: geo[indice[id]].x, top: geo[indice[id]].y});

  // Passo 0.
  const s0 = estados[0];
  gsap.set($("cena"), cameraDe(s0));
  gsap.set(contexto, {autoAlpha: 1});
  gsap.set(Object.values(cartoes), {autoAlpha: 0, y: 0});
  gsap.set(Object.values(bolinhas), {backgroundColor: "#ffffff"});
  gsap.set([$("anel"), $("rotulo-final")], {autoAlpha: 0});
  for (const {haste, ponta, ameaca} of Object.values(setas)) {
    gsap.set(haste, ameaca ? {autoAlpha: 0} : {drawSVG: "0%", autoAlpha: 1});
    gsap.set(ponta, {autoAlpha: 0});
  }

  const tl = gsap.timeline({paused: true});
  const fade = (alvo, de, para, t, dur = DUR.narracao) => tl.fromTo(alvo, {autoAlpha: de}, {autoAlpha: para, duration: dur, ease: "none", immediateRender: false}, t);
  tl.addLabel("p0", 0);
  estados.forEach((s, i) => {
    if (i === 0) return;
    const a = estados[i - 1], t = tl.duration() + 0.001;
    tl.to({}, {duration: 0.4}, t);
    narracao.transicao(tl, i, t);

    // Câmera e contexto: no zoom o contexto sai antes de a cena crescer; no recuo, volta quando ela assenta.
    if (s.camera !== a.camera) {
      tl.fromTo($("cena"), cameraDe(a), {...cameraDe(s), duration: CAMERA, ease: SUAVE, immediateRender: false}, t);
      if (a.camera === "geral") fade(contexto, 1, 0, t);
      if (s.camera === "geral") fade(contexto, 0, 1, t + ASSENTA);
    }
    // Cartão: fecha no começo do recuo, abre quando o zoom assenta.
    if (a.cartao && a.cartao !== s.cartao) fade(cartoes[a.cartao], 1, 0, t, DUR.salto);
    if (s.cartao && s.cartao !== a.cartao) tl.fromTo(cartoes[s.cartao], {autoAlpha: 0, y: 6}, {autoAlpha: 1, y: 0, duration: DUR.narracao, ease: "none", immediateRender: false}, t + ASSENTA);
    // Bolinha marcada: enche com a cor do ator quando o cartão abre.
    for (const id of s.vistos.filter((x) => !a.vistos.includes(x))) {
      const cor = COR[lista[indice[id]].ator];
      tl.fromTo(bolinhas[id], {backgroundColor: "#ffffff"}, {backgroundColor: cor, duration: DUR.marcador, ease: "none", immediateRender: false}, t + ASSENTA);
    }
    // Anel de foco: aparece no primeiro evento e desliza com a câmera de um evento ao seguinte.
    if (s.atual !== a.atual) {
      if (!a.atual) { tl.set($("anel"), posAnel(s.atual), t); fade($("anel"), 0, 1, t + ASSENTA); }
      else tl.fromTo($("anel"), posAnel(a.atual), {...posAnel(s.atual), duration: CAMERA, ease: SUAVE, immediateRender: false}, t);
    }
    // Setas: a comum se desenha da bolinha ao destino; a de ameaça, tracejada, entra com fade.
    for (const id of s.setas.filter((x) => !a.setas.includes(x))) {
      const {haste, ponta, ameaca} = setas[id];
      if (ameaca) fade(haste, 0, 1, t + ASSENTA, DUR.seta);
      else tl.fromTo(haste, {drawSVG: "0%"}, {drawSVG: "100%", duration: DUR.seta, ease: "none", immediateRender: false}, t + ASSENTA);
      fade(ponta, 0, 1, t + ASSENTA + DUR.seta - 0.1, 0.1);
    }
    for (const id of a.setas.filter((x) => !s.setas.includes(x))) fade([setas[id].haste, setas[id].ponta], 1, 0, t + ASSENTA, DUR.seta);
    if (s.rotuloFinal && !a.rotuloFinal) fade($("rotulo-final"), 0, 1, t + ASSENTA);
    tl.addLabel("p" + i, tl.duration());
  });
  return {estados, tl};
}

iniciar({animacao: "sombra-noruega", cenarios: cenarios.map((c) => c.id), rotulos: cenarios.map((c) => c.rotulo), preparar, espera: (s) => s.dur});
</script>
</body>
